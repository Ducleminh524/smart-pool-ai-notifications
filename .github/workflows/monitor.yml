name: Roboflow and Kaggle - Separate Slack Channels

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roboflow-kaggle-slack-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        
      - name: Test Kaggle API
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_ACCOUNT_USERNAME: ${{ vars.KAGGLE_ACCOUNT_USERNAME }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::KAGGLE_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "$KAGGLE_ACCOUNT_USERNAME" ]; then
            echo "::error::KAGGLE_ACCOUNT_USERNAME is missing"
            exit 1
          fi

          echo "Testing Kaggle authentication..."
          kaggle kernels list \
            --user "$KAGGLE_ACCOUNT_USERNAME" \
            --page-size 5
            
      - name: Debug Kaggle notebook status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_ACCOUNT_USERNAME: ${{ vars.KAGGLE_ACCOUNT_USERNAME }}
        shell: bash
        run: |
          echo "Checking Kaggle notebooks..."
          kaggle kernels list \
            --user "$KAGGLE_ACCOUNT_USERNAME" \
            --page-size 20

          echo "Checking notebook status..."
          python - <<'PY'
          import os
          import subprocess

          username = os.environ["KAGGLE_ACCOUNT_USERNAME"]

          result = subprocess.run(
              [
                  "kaggle", "kernels", "list",
                  "--user", username,
                  "--csv", "--page-size", "20"
              ],
              capture_output=True,
              text=True
          )

          if result.returncode != 0:
              print("List error:", result.stderr[:2000])
              raise SystemExit(1)

          import csv
          import io

          rows = list(csv.DictReader(
              io.StringIO(result.stdout)
          ))

          if not rows:
              print("No notebooks found")
          else:
              ref = rows[0].get("ref") or rows[0].get("Ref")

              if not ref:
                  print("CSV columns:", list(rows[0]))
                  raise SystemExit(1)

              print("Testing notebook:", ref)

              status = subprocess.run(
                  ["kaggle", "kernels", "status", ref],
                  capture_output=True,
                  text=True
              )

              print("Exit code:", status.returncode)
              print("STDOUT:", status.stdout[:2000])
              print("STDERR:", status.stderr[:2000])

              raise SystemExit(status.returncode)
          PY


      - name: Monitor separately and notify Slack
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          ROBOFLOW_WORKSPACE: ${{ vars.ROBOFLOW_WORKSPACE }}
          ROBOFLOW_PROJECT: ${{ vars.ROBOFLOW_PROJECT }}
          ROBOFLOW_SLACK_WEBHOOK_URL: ${{ secrets.ROBOFLOW_SLACK_WEBHOOK_URL }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_ACCOUNT_USERNAME: ${{ vars.KAGGLE_ACCOUNT_USERNAME }}
          KAGGLE_NOTEBOOKS: ${{ vars.KAGGLE_NOTEBOOKS }}
          KAGGLE_SLACK_WEBHOOK_URL: ${{ secrets.KAGGLE_SLACK_WEBHOOK_URL }}
        run: python scripts/monitor.py
      - name: Persist updated state (including partial success)
        if: always()
        run: |
          if [ -f state/monitor.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/monitor.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update AI monitor state [skip ci]"
              git push
            fi
          fi
